<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Demonstrating multiple inline HTML elements -->
    <p>
        I am <strong>Samriddhi</strong> and I enjoy
        <em>learning new technologies</em>.
        <mark>Web development</mark> is one of my interests.<br>
        <small>This page is created using HTML only.</small>
    </p>

</body>
</html>
